name: ci
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI container, no password needed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPEN_DATA_STORE_TEST_PG: "host=localhost port=5432 user=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests deploy && ruff format --check src tests deploy
      - run: docker compose -f deploy/nas/compose.yaml --env-file deploy/nas/.env.example config -q
      - run: pytest -q -W error

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the stack starts from nothing, creates its roles and dumps its catalogue
        run: |
          mkdir -p "$RUNNER_TEMP/stack/data"
          cat > "$RUNNER_TEMP/stack/.env" <<EOF
          # this job never runs install or publish: the value only has to be set
          OPEN_DATA_STORE_REF=${GITHUB_SHA}
          OPEN_DATA_STORE_HOST_DIR=$RUNNER_TEMP/stack/data
          OPEN_DATA_STORE_UID_GID=$(id -u):$(id -g)
          OPEN_DATA_STORE_PG_BIND=127.0.0.1:5433
          OPEN_DATA_STORE_CATALOG_DB=lake_catalog
          OPEN_DATA_STORE_ADMIN_PASSWORD=ci-admin
          OPEN_DATA_STORE_PUBLISHER_PASSWORD=ci-publisher
          OPEN_DATA_STORE_READER_PASSWORD=ci-reader
          OPEN_DATA_STORE_APPROVE=
          OPEN_DATA_STORE_APPROVED_BY=
          EOF
          dc="docker compose -f deploy/nas/compose.yaml --env-file $RUNNER_TEMP/stack/.env"
          $dc up -d --wait catalog
          $dc run --rm backup
          $dc run --rm init
          test -s "$(ls "$RUNNER_TEMP"/stack/data/backups/lake_catalog-*.dump | head -n 1)"
          docker run --rm --network host -e PGPASSWORD=ci-reader postgres:16 \
            psql -h 127.0.0.1 -p 5433 -U lake_reader -d lake_catalog -Atc "SELECT 1"
          $dc down -v
      - name: a dump restores into a fresh stack, readable by lake_reader (stack migration path)
        run: |
          # Probes the operator path (dump, fresh stack, init, pg_restore as lake_publisher, read as
          # lake_reader) on a plain table; a real DuckLake catalogue is restored the same way.
          mkdir -p "$RUNNER_TEMP/rst/data"
          sed "s#$RUNNER_TEMP/stack/data#$RUNNER_TEMP/rst/data#" "$RUNNER_TEMP/stack/.env" > "$RUNNER_TEMP/rst/.env"
          dc="docker compose -f deploy/nas/compose.yaml --env-file $RUNNER_TEMP/rst/.env"
          pub() { docker run --rm --network host -e PGPASSWORD=ci-publisher postgres:16 \
            psql -h 127.0.0.1 -p 5433 -U lake_publisher -d lake_catalog -v ON_ERROR_STOP=1 -Atc "$1"; }
          $dc up -d --wait catalog
          $dc run --rm init
          pub "CREATE TABLE ducklake_probe (n int); INSERT INTO ducklake_probe VALUES (1), (2), (3)"
          $dc run --rm backup
          dump="$(basename "$(ls "$RUNNER_TEMP"/rst/data/backups/lake_catalog-*.dump | tail -n 1)")"
          $dc down -v
          $dc up -d --wait catalog
          $dc run --rm init
          $dc run --rm backup sh -c "pg_restore --exit-on-error -d \"\$PGDATABASE\" /data/backups/$dump"
          test "$(docker run --rm --network host -e PGPASSWORD=ci-reader postgres:16 \
            psql -h 127.0.0.1 -p 5433 -U lake_reader -d lake_catalog -Atc \
            "SELECT count(*) FROM ducklake_probe")" = 3
          $dc down -v

  # Publication check on every PR and push: build, `twine check --strict`, and install the
  # wheel (with its reader extra) in a fresh venv away from the checkout. release.yml repeats
  # this and adds the tag check and the upload.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build . --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls "$PWD"/dist/*.whl)[reader]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import open_data_store; print(open_data_store.__file__)"
          "$RUNNER_TEMP/smoke/bin/open-data-store" --help
